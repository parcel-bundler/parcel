[workspace]
resolver = "2"
members = ["crates/*"]

[profile.canary]
inherits = "release"
debug = true

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[patch.crates-io]
# Swap browserslist-rs for the oxc fork (compressed caniuse data) everywhere,
# including inside swc's preset_env_base.
browserslist-rs = { path = "crates/browserslist-compat" }
html5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
xml5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
markup5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
ravif = { git = "https://github.com/devongovett/cavif-rs.git", branch = "bit_depth_10" }
lightningcss = { git = "https://github.com/parcel-bundler/lightningcss", branch = "master" }
parcel_selectors = { git = "https://github.com/parcel-bundler/lightningcss", branch = "master" }
# swc from devongovett/swc (branch minifier-sequences-perf), for the minifier's sequence merging
# speedup. Every crate the fork has at a semver-compatible version is patched, so that one copy of
# each is built. swc_core,
# swc_ecma_preset_env, preset_env_base and testing_macros are a major version ahead there, so they
# stay on crates.io and use these.
ast_node = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
better_scoped_tls = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
from_variant = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
hstr = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
string_enum = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
swc_allocator = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
swc_atoms = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
swc_common = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
swc_config = { git = "https://github.com/devongovett/swc.git", branch = "minifier-sequences-perf" }
