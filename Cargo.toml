[workspace]
resolver = "2"
members = ["crates/*"]

[profile.canary]
inherits = "release"
debug = true

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[patch.crates-io]
# Swap browserslist-rs for the oxc fork (compressed caniuse data) everywhere,
# including inside swc's preset_env_base.
browserslist-rs = { path = "crates/browserslist-compat" }
html5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
xml5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
markup5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
ravif = { git = "https://github.com/devongovett/cavif-rs.git", branch = "bit_depth_10" }
lightningcss = { git = "https://github.com/parcel-bundler/lightningcss", branch = "master" }
parcel_selectors = { git = "https://github.com/parcel-bundler/lightningcss", branch = "master" }

# swc from devongovett/swc perf-arguments-atom (swc-project/swc PR: avoid refcount contention on
# atom!("arguments") in the renamer and DCE, ~2.7x faster parallel packaging). Every swc crate is
# patched, not just the two that changed: git crates resolve their path dependencies from the same
# repo, so patching only some would duplicate swc_common, swc_ecma_ast, etc.
ast_node = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
better_scoped_tls = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
from_variant = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
hstr = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
preset_env_base = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
string_enum = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
swc_allocator = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
swc_atoms = { git = "https://github.com/devongovett/swc.git", branch = "perf-arguments-atom" }
