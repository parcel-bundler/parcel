name: core-rs3

on:
  push:
    branches:
      - core-rs3

permissions:
  contents: read

jobs:
  rust_tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: yarn
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
      - run: yarn --immutable
      - run: yarn gulp
      - run: cargo test --workspace --exclude parcel-node-bindings --tests
