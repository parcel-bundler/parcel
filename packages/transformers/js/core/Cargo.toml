[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "parcel-js-swc-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
swc_core = { version = "66", features = [
  "common",
  "common_concurrent",
  "common_sourcemap",
  "ecma_ast",
  "ecma_codegen",
  "ecma_minifier",
  "ecma_parser",
  "ecma_preset_env",
  "ecma_transforms",
  "ecma_transforms_compat",
  "ecma_transforms_optimization",
  "ecma_transforms_proposal",
  "ecma_transforms_react",
  "ecma_transforms_typescript",
  "ecma_utils",
  "ecma_visit",
  "ecma_quote",
  "stacker"
] }
swc_node_comments = "22"
indoc = "1.0.3"
serde = "1.0.123"
serde_bytes = "0.11.5"
Inflector = "0.11.4"
data-encoding = "2.3.2"
sha-1 = "0.10.0"
dunce = "1.0.1"
pathdiff = "0.2.0"
path-slash = "0.1.4"
indexmap = { version = "2.11.0", features = ["serde"] }
parcel-macros = { path = "../../../../crates/macros" }
parking_lot = "0.12"
bitflags = { version = "2.7.0", features=["serde"] }
mdxjs = { git = "https://github.com/vercel-labs/mdxjs-rs-turbopack.git", branch = "turbopack" }
markdown = { version = "1.0.0", features = ["serde"] }
rustc-hash = "2"
