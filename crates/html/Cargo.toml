[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "parcel-html"
version = "0.1.0"
edition = "2024"

[dependencies]
html5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
serde = { version = "1.0.123", features = ["derive"] }
serde_bytes = "0.11.5"
serde_json = "1.0.91"
typed-arena = "2.0.2"
xml5ever = { git = "https://github.com/devongovett/html5ever.git", branch = "xmlns-attrs" }
cssparser = "0.34.0"
oxvg_ast = { git = "https://github.com/noahbald/oxvg.git" }
oxvg_optimiser = { git = "https://github.com/noahbald/oxvg.git" }
anyhow = "*"
selectors = "0.26"
swc_core = { version = "21", features = [
  "common",
  "ecma_parser",
  "ecma_ast",
  "ecma_codegen",
] }
lightningcss = { path = "/Users/devongovett/dev/lightningcss" }
convert_case = "0.6.0"
indexmap = { version = "1.9.2", features = ["serde"] }
ref-cast = "1.0"
parcel-core = { path = "../core" }

[dev-dependencies]
indoc = "1.0.3"
