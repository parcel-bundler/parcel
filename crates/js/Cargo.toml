[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "parcel-js"
version = "0.1.0"
edition = "2024"

[dependencies]
parcel-core = { path = "../core" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["preserve_order", "raw_value"] }
indexmap = { version = "2.11.0", features = ["serde"] }
parcel-plugin-js = { path = "../plugin-js" }
parcel-css = { path = "../css" }
parcel-resolver = { path = "../parcel-resolver" }
parcel-macros = { path = "../macros" }
node-semver = "2.2.0"
glob-match = "*"
swc_core = { version = "77", features = [
  "common",
  "common_concurrent",
  "common_sourcemap",
  "ecma_ast",
  "ecma_codegen",
  "ecma_minifier",
  "ecma_parser",
  "ecma_preset_env",
  "ecma_transforms",
  "ecma_transforms_compat",
  "ecma_transforms_optimization",
  "ecma_transforms_proposal",
  "ecma_transforms_react",
  "ecma_transforms_typescript",
  "ecma_utils",
  "ecma_visit",
  "ecma_quote",
  "stacker",
] }
fixedbitset = "0.5.7"
bytecount = "0.6.9"
simd-utf16-len = "0.1.0"
data-encoding = "2.3.2"
swc_node_comments = "27"
serde_bytes = "0.11.5"
dunce = "1.0.1"
pathdiff = "0.2.0"
path-slash = "0.1.4"
parking_lot = "0.12"
bitflags = { version = "2.7.0", features = ["serde"] }
mdxjs = { git = "https://github.com/vercel-labs/mdxjs-rs-turbopack.git", branch = "turbopack" }
markdown = "1.0.0"
rustc-hash = "2.1.3"

[dev-dependencies]
indoc = "1.0.3"

[build-dependencies]
swc_core = { version = "77", features = [
  "common",
  "ecma_ast",
  "ecma_codegen",
  "ecma_minifier",
  "ecma_parser",
  "ecma_transforms",
  "ecma_visit",
] }
