language = "C"
include_guard = "PARCEL_PLUGIN_H"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]

[export]
include = ["ParcelApi", "InitStatus", "Diagnostic", "DiagnosticSeverity", "ResolveResult", "ResolutionType", "OptimizeResult", "ReportEvent", "ReportEventType", "LogLevel", "SpecifierType", "Priority", "BundleBehavior", "ImportType", "DependencyFlags", "ExportsConditions", "AssetFlags", "EnvironmentFlags", "BundleFlags", "FileKind", "BundleGraphDependencyResolution", "PARCEL_INVALID_ASSET_INDEX"]
exclude = ["CPlugin", "AssetFlagsFFI", "DependencyFlagsFFI", "ExportsConditionsFFI", "EnvironmentFlagsFFI", "BundleFlagsFFI", "FileKindFFI", "SpecifierTypeFFI", "PriorityFFI", "BundleBehaviorFFI", "ImportTypeFFI", "DiagnosticSeverityFFI", "ResolutionTypeFFI", "LogLevelFFI"]

[export.rename]
"AssetFlagsFFI" = "AssetFlags"
"DependencyFlagsFFI" = "DependencyFlags"
"ExportsConditionsFFI" = "ExportsConditions"
"EnvironmentFlagsFFI" = "EnvironmentFlags"
"BundleFlagsFFI" = "BundleFlags"
"FileKindFFI" = "FileKind"
"SpecifierTypeFFI" = "SpecifierType"
"PriorityFFI" = "Priority"
"BundleBehaviorFFI" = "BundleBehavior"
"ImportTypeFFI" = "ImportType"
"DiagnosticSeverityFFI" = "DiagnosticSeverity"
"ResolutionTypeFFI" = "ResolutionType"
"LogLevelFFI" = "LogLevel"
