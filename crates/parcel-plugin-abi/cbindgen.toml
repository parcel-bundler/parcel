language = "C"
include_guard = "PARCEL_PLUGIN_H"
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h"]

[export]
include = ["Diagnostic", "ResolveResult", "DependencyFlags", "AssetFlags", "EnvironmentFlags"]
exclude = ["CPlugin", "AssetFlagsFFI", "DependencyFlagsFFI", "EnvironmentFlagsFFI"]

[export.rename]
"AssetFlagsFFI" = "AssetFlags"
"DependencyFlagsFFI" = "DependencyFlags"
"EnvironmentFlagsFFI" = "EnvironmentFlags"
