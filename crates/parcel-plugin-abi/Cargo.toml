[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "parcel-plugin-abi"
version = "0.1.0"
edition = "2024"

[build-dependencies]
cbindgen = "0.29"
bindgen = "0.72.1"

[dependencies]
parcel-core = { path = "../core" }
libloading = "0.8.5"
hstr = { version = "4.0.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
