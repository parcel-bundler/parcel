[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "parcel-evaluator"
version = "0.1.0"
edition = "2021"

[dependencies]
indexmap = { version = "1.9.2", features = ["serde"] }
swc_core = { version = "21", features = [
  "common",
  "common_sourcemap",
  "ecma_ast",
  "ecma_codegen",
  "ecma_parser",
  "ecma_preset_env",
  "ecma_transforms",
  "ecma_transforms_compat",
  "ecma_transforms_optimization",
  "ecma_transforms_proposal",
  "ecma_transforms_react",
  "ecma_transforms_typescript",
  "ecma_visit",
  "ecma_utils"
] }
serde = "1.0.123"
num-bigint = "0.4.6"
num-traits = "0.2.19"
itertools = "*"
as-any = "0.3.2"
phf = "0.11.2"
data-encoding = "2.3.2"
parcel-core = { path = "../core" }
petgraph = "*"

[dev-dependencies]
pretty_assertions = "*"
