[package]
# Deliberately named `browserslist-rs` so that `[patch.crates-io]` in the
# workspace root can substitute this crate for the real one everywhere in the
# graph, including inside swc (`preset_env_base`).
name = "browserslist-rs"
version = "0.19.0"
edition = "2024"

[lib]
# Matches the upstream lib name so `browserslist::resolve(..)` keeps compiling.
name = "browserslist"
path = "src/lib.rs"

[dependencies]
oxc_browserslist = { package = "oxc-browserslist", version = "5" }
serde = { version = "1.0.228", features = ["derive"] }
