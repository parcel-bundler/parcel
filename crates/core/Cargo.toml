[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "parcel-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = { version = "2.7.0", features = ["serde"] }
browserslist-rs = "0.18.1"
json-sourcemap = "0.2.0"
node-semver = "2.2.0"
serde = { version = "1.0.123", features = ["derive", "rc"] }
serde_bytes = "0.11.5"
serde-value = "0.7.0"
indexmap = { version = "1.9.2", features = ["serde"] }
glob-match = "*"
petgraph = "*"
fixedbitset = "0.5.7"
