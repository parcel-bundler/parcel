<!DOCTYPE html>
<html lang="en">
<head>
  <title>HTML macros</title>
  <parcel:define name="code" src="macro.mjs#code"></parcel:define>
</head>
<body>
  <parcel:macro src="macro.mjs" prop="test">content</parcel:macro>
  <parcel:macro src="macro.mjs#other"><em>test</em></parcel:macro>
  <code lang="js">hi</code>
  <parcel:macro src="macro.mjs#nav"><a href="ignored.html">ignored</a></parcel:macro>
</body>
</html>
